<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Ledger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="ledger-mark"><span class="dot"></span>Ledger</div>
      <h1>Create your account</h1>
      <p class="auth-sub">Start tracking customers, loans and repayments.</p>

      <div class="alert alert-error" id="errorBox"></div>

      <form id="signupForm">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" required autocomplete="name" placeholder="Jane Doe">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Create account</button>
      </form>

      <div class="auth-links">
        <a href="index.html">Already have an account?</a>
        <span></span>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (getToken()) window.location.href = '/home.html';

    const form = document.getElementById('signupForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';

      try {
        const data = await api('/auth/signup', {
          method: 'POST',
          body: {
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          }
        });
        setSession(data.token, data.user);
        window.location.href = '/home.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
  <!-- 1. ALWAYS LOAD CONFIG FIRST -->
<script src="js/config.js"></script>

<!-- 2. Load page-specific script AFTER config -->
<script src="js/signup.js"></script>
</body>
</html>
