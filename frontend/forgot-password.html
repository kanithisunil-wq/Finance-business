<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Ledger</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="ledger-mark"><span class="dot"></span>Ledger</div>
      <h1>Forgot your password?</h1>
      <p class="auth-sub">Enter your email and we'll generate a reset link.</p>

      <div class="alert alert-error" id="errorBox"></div>
      <div class="alert alert-success" id="successBox"></div>

      <form id="forgotForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Send reset link</button>
      </form>

      <div id="devLinkBox" style="display:none; margin-top:16px; padding:12px; background:#F6F7F4; border:1px solid var(--line); border-radius:8px; font-size:12.5px; word-break:break-all;">
        <strong>Demo mode — no email server configured.</strong><br>
        Use this link to continue: <a id="devLink" href="#"></a>
      </div>

      <div class="auth-links">
        <a href="/index.html">Back to log in</a>
        <span></span>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('forgotForm');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const submitBtn = document.getElementById('submitBtn');
    const devLinkBox = document.getElementById('devLinkBox');
    const devLink = document.getElementById('devLink');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      try {
        const data = await api('/auth/forgot-password', {
          method: 'POST',
          body: { email: document.getElementById('email').value.trim() }
        });
        successBox.textContent = data.message;
        successBox.classList.add('show');
        if (data.resetLink) {
          devLink.href = data.resetLink;
          devLink.textContent = data.resetLink;
          devLinkBox.style.display = 'block';
        }
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
