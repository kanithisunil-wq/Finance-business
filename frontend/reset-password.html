<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set new password — Ledger</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="ledger-mark"><span class="dot"></span>Ledger</div>
      <h1>Set a new password</h1>
      <p class="auth-sub">Choose a new password for your account.</p>

      <div class="alert alert-error" id="errorBox"></div>

      <form id="resetForm">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input type="password" id="confirm" required minlength="6" autocomplete="new-password" placeholder="Re-enter password">
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Update password</button>
      </form>

      <div class="auth-links">
        <a href="/index.html">Back to log in</a>
        <span></span>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const token = qsParam('token');
    const form = document.getElementById('resetForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    if (!token) {
      errorBox.textContent = 'This reset link is missing its token. Please request a new one.';
      errorBox.classList.add('show');
      form.querySelectorAll('input, button').forEach(el => el.disabled = true);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.classList.add('show');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating…';

      try {
        await api('/auth/reset-password', { method: 'POST', body: { token, password } });
        sessionStorage.setItem('justReset', '1');
        window.location.href = '/index.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
